<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f1">
  <title>这周是大周 · 大小周日历</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #242820;
      --muted: #85887d;
      --paper: #f6f5f1;
      --card: #fffefa;
      --line: #ecebe4;
      --green: #425b45;
      --green-soft: #e9eee6;
      --orange: #e9a56e;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        radial-gradient(ellipse at 15% 12%, rgba(232, 224, 204, .42), transparent 35%),
        var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      position: relative;
      width: min(100%, 760px);
      overflow: hidden;
      padding: 38px 38px 30px;
      border: 1px solid rgba(226, 225, 216, .8);
      border-radius: 24px;
      background: var(--card);
      box-shadow: 0 22px 70px rgba(54, 58, 45, .08), 0 2px 8px rgba(54, 58, 45, .03);
      animation: rise .65s ease-out both;
    }

    .card::before {
      position: absolute;
      top: 0;
      left: 38px;
      width: 52px;
      height: 4px;
      border-radius: 0 0 5px 5px;
      background: var(--orange);
      content: "";
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .14em;
    }

    .eyebrow::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--orange);
      content: "";
    }

    h1 {
      margin: 32px 0 8px;
      font-size: clamp(64px, 18vw, 88px);
      font-weight: 650;
      letter-spacing: -.075em;
      line-height: .95;
    }

    .subtitle {
      margin: 17px 0 0;
      color: #74776d;
      font-size: 15px;
    }

    .month-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 30px;
    }

    .month-heading h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -.03em;
    }

    .month-heading p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .month-heading .legend { display: flex; gap: 12px; color: var(--muted); font-size: 11px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { width: 7px; height: 7px; border-radius: 50%; background: #789073; }
    .legend .holiday-dot { background: #d5a477; }
    .legend .makeup-dot { background: #a7a89f; }

    .month-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 20px;
    }

    .stat {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 17px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fbfaf6;
    }

    .stat-label { color: var(--muted); font-size: 12px; }
    .stat strong { font-size: 23px; font-weight: 650; letter-spacing: -.04em; }
    .stat small { margin-left: 3px; color: var(--muted); font-size: 11px; font-weight: 400; }
    .stat.rest-stat strong { color: var(--green); }
    .stat.work-stat strong { color: var(--ink); }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 7px;
      margin-top: 16px;
    }

    .weekday {
      padding: 0 0 7px;
      color: #a0a197;
      text-align: center;
      font-size: 11px;
      font-weight: 500;
    }

    .day {
      position: relative;
      display: grid;
      min-height: 62px;
      align-content: center;
      justify-items: center;
      gap: 5px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: #f7f6f1;
      color: #777a70;
      font-size: 13px;
    }

    .day.empty { background: transparent; }
    .day .day-number { color: var(--ink); font-size: 14px; font-weight: 600; }
    .day .day-type { font-size: 10px; }
    .day.rest { background: var(--green-soft); }
    .day.rest .day-type { color: var(--green); }
    .day.holiday:not(.rest) { background: #f5eee6; }
    .day.holiday .day-type { color: #9b704e; }
    .day.makeup { background: #efeee8; }
    .day.makeup .day-type { color: #777a70; }
    .day.holiday.rest { background: linear-gradient(135deg, var(--green-soft) 50%, #f5eee6 50%); }
    .day.today { border-color: #748b6e; box-shadow: inset 0 0 0 1px #748b6e; }
    .day.today::after {
      position: absolute;
      top: 5px;
      right: 6px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #748b6e;
      content: "";
    }

    footer {
      margin-top: 24px;
      color: #a0a197;
      font-size: 11px;
      line-height: 1.7;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      .card { padding: 32px 22px 25px; border-radius: 20px; }
      .card::before { left: 22px; }
      .calendar { gap: 5px; }
      .month-stats { gap: 8px; }
      .stat { padding: 12px; }
      .stat strong { font-size: 20px; }
      .day { min-height: 52px; border-radius: 9px; }
      .day .day-number { font-size: 13px; }
      .day .day-type { font-size: 9px; }
      .month-heading { align-items: flex-start; flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="result-title">
    <p class="eyebrow">大小周 · 月历视图</p>
    <h1 id="result-title">—</h1>
    <p class="subtitle" id="subtitle">正在读取当前日期…</p>

    <section class="month-heading" aria-labelledby="month-title">
      <div>
        <h2 id="month-title">—</h2>
        <p>按周一至周日排列 · 每周轮换</p>
      </div>
      <div class="legend" aria-label="日历图例">
        <span><i></i>大小周休息日</span>
        <span><i class="holiday-dot"></i>法定假日</span>
        <span><i class="makeup-dot"></i>调休补班</span>
      </div>
    </section>

    <section class="month-stats" aria-label="本月工作休息统计">
      <div class="stat rest-stat"><span class="stat-label">本月休息</span><strong><span id="rest-count">—</span><small>天</small></strong></div>
      <div class="stat work-stat"><span class="stat-label">本月上班</span><strong><span id="work-count">—</span><small>天</small></strong></div>
    </section>

    <section class="calendar" id="calendar" aria-label="大小周日历">
      <span class="weekday">一</span><span class="weekday">二</span><span class="weekday">三</span>
      <span class="weekday">四</span><span class="weekday">五</span><span class="weekday">六</span><span class="weekday">日</span>
    </section>

    <footer id="data-status" role="status" aria-live="polite">正在读取当前日期…</footer>
  </main>
  <script>
    (() => {
      const DAY_MS = 24 * 60 * 60 * 1000;
      const WEEKDAY_CN = ['日', '一', '二', '三', '四', '五', '六'];
      // 已知基准：2026 年 9 月 7 日（周一）所在周为大周，之后每周交替
      const ANCHOR = new Date(2026, 8, 7);

      const startOfDay = date => new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const mondayOf = date => {
        const monday = startOfDay(date);
        monday.setDate(monday.getDate() - (monday.getDay() + 6) % 7);
        return monday;
      };
      const weekOffset = date => Math.round((mondayOf(date) - ANCHOR) / (7 * DAY_MS));
      const isBigWeek = date => weekOffset(date) % 2 === 0;

      const formatDay = date => `${date.getMonth() + 1} 月 ${date.getDate()} 日`;

      const today = startOfDay(new Date());
      const year = today.getFullYear();
      const month = today.getMonth() + 1;
      const daysInMonth = new Date(year, month, 0).getDate();
      const weekType = isBigWeek(today) ? '大周' : '小周';

      document.getElementById('result-title').textContent = weekType;
      document.getElementById('subtitle').textContent =
        `${formatDay(today)}，星期${WEEKDAY_CN[today.getDay()]} · 本周为${weekType}`;
      document.getElementById('month-title').textContent = `${year} 年 ${month} 月`;

      const calendar = document.getElementById('calendar');
      const dayCells = new Map();
      calendar.setAttribute('aria-label', `${year}年${month}月大小周日历`);

      const appendEmpty = () => {
        const empty = document.createElement('span');
        empty.className = 'day empty';
        empty.setAttribute('aria-hidden', 'true');
        calendar.appendChild(empty);
      };

      const refreshLabel = cell => {
        const parts = [];
        if (cell.dataset.holiday) parts.push(cell.dataset.holiday);
        else if (cell.classList.contains('makeup')) parts.push('调休补班');
        else if (cell.classList.contains('rest')) parts.push('休息');
        if (cell.classList.contains('today')) parts.push('今天');

        let label = cell.querySelector('.day-type');
        if (!parts.length) {
          if (label) label.remove();
          return;
        }
        if (!label) {
          label = document.createElement('span');
          label.className = 'day-type';
          cell.appendChild(label);
        }
        label.textContent = parts.join(' · ');
      };

      const leadingEmpty = (new Date(year, month - 1, 1).getDay() + 6) % 7;
      for (let i = 0; i < leadingEmpty; i++) appendEmpty();

      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month - 1, day);
        const weekday = date.getDay();
        const cell = document.createElement('span');
        cell.className = 'day';
        if (weekday === 0 || (weekday === 6 && isBigWeek(date))) cell.classList.add('rest');
        if (day === today.getDate()) {
          cell.classList.add('today');
          cell.setAttribute('aria-current', 'date');
        }

        const number = document.createElement('span');
        number.className = 'day-number';
        number.textContent = day;
        cell.appendChild(number);

        refreshLabel(cell);
        calendar.appendChild(cell);
        dayCells.set(day, cell);
      }

      while (calendar.querySelectorAll('.day').length % 7 !== 0) appendEmpty();

      const restCount = document.getElementById('rest-count');
      const workCount = document.getElementById('work-count');

      const updateStats = () => {
        let restDays = 0;
        for (const cell of dayCells.values()) {
          if (cell.classList.contains('rest') || cell.classList.contains('holiday')) restDays++;
        }
        restCount.textContent = restDays;
        workCount.textContent = daysInMonth - restDays;
      };

      const markSpecialDays = entries => {
        for (const detail of Object.values(entries)) {
          const [entryYear, entryMonth, entryDay] = detail.date.split('-').map(Number);
          if (entryYear !== year || entryMonth !== month) continue;
          const cell = dayCells.get(entryDay);
          if (!cell) continue;

          if (detail.holiday) {
            cell.classList.add('holiday');
            cell.dataset.holiday = detail.name;
          } else if (detail.after) {
            cell.classList.remove('rest');
            cell.classList.add('makeup');
          }
          refreshLabel(cell);
        }
      };

      updateStats();

      const status = document.getElementById('data-status');
      status.textContent = `正在获取 ${year} 年法定节假日与调休安排…`;

      fetch(`https://timor.tech/api/holiday/year/${year}`)
        .then(response => {
          if (!response.ok) throw new Error('holiday request failed');
          return response.json();
        })
        .then(data => {
          if (data.code !== 0 || !data.holiday) throw new Error('invalid holiday data');
          markSpecialDays(data.holiday);
          updateStats();
          status.textContent = '已同步节假日与调休安排 · 休息日含大小周周末及法定假日';
        })
        .catch(() => {
          status.textContent = '节假日数据暂不可用 · 统计基于大小周周末，联网后可刷新重试';
        });
    })();
  </script>
</body>
</html>
